name: mobile_flutter
description: "Aplikasi Mobile Room Booking menggunakan Flutter, Supabase & Edge Functions"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Supabase Flutter SDK (Auth, Database, Realtime, Edge Functions)
  supabase_flutter: ^2.8.0
  # State management & Utilities
  intl: ^0.19.0
  google_fonts: ^6.2.1
  file_picker: ^8.1.7
  qr_flutter: ^4.1.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
